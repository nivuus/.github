name: Security

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used to audit the Python manifest
        type: string
        default: "3.12"

jobs:
  security:
    name: Secrets and dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
          if [ -n "$BASE_SHA" ]; then
            range="${BASE_SHA}..${HEAD_SHA}"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            range="-1"
          fi
          echo "Scanning range: $range"
          gitleaks git --no-banner --redact --exit-code 1 --log-opts="$range" .

      - name: Set up Python for the audit
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Audit Python dependencies
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --quiet --upgrade pip
            python -m pip install --quiet pip-audit
            python -m pip_audit --strict -r requirements.txt
          elif [ -f pyproject.toml ]; then
            python -m pip install --quiet --upgrade pip
            python -m pip install --quiet pip-audit
            python -m pip_audit --strict .
          else
            echo "No Python manifest, skipping."
          fi

      - name: Audit Rust dependencies
        run: |
          if [ -f Cargo.lock ]; then
            cargo install cargo-audit --locked
            # Warnings (unmaintained, yanked) are worth reporting but are not
            # vulnerabilities: they describe a maintenance state, not a flaw.
            # The Node audit draws the same line with --audit-level=high.
            cargo audit --json > /tmp/audit.json || true
            count=$(jq '.vulnerabilities.count' /tmp/audit.json)
            warnings=$(jq '[.warnings[]?] | flatten | length' /tmp/audit.json)
            echo "Vulnerabilities: $count, warnings: $warnings"
            if [ "$warnings" -gt 0 ]; then
              jq -r '.warnings | to_entries[] | .value[] | "WARNING \(.kind): \(.package.name) — \(.advisory.id)"' /tmp/audit.json || true
            fi
            if [ "$count" -gt 0 ]; then
              jq -r '.vulnerabilities.list[] | "VULNERABILITY: \(.package.name) \(.package.version) — \(.advisory.id) \(.advisory.title)"' /tmp/audit.json
              exit 1
            fi
          else
            echo "No Cargo.lock, skipping."
          fi

      - name: Audit Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm audit --audit-level=high
          else
            echo "No package-lock.json, skipping."
          fi
