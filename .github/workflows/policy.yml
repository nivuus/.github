name: Policy

on:
  workflow_call:
    inputs:
      socle-ref:
        description: Ref of nivuus/.github to take the checks from
        type: string
        default: main

jobs:
  policy:
    name: Coding rules
    runs-on: ubuntu-latest
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the shared socle
        uses: actions/checkout@v4
        with:
          repository: nivuus/.github
          ref: ${{ inputs.socle-ref }}
          path: .nivuus-socle

      - name: Install gawk
        run: sudo apt-get update && sudo apt-get install -y gawk

      - name: Resolve the base ref
        id: base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          git fetch -q origin "$BASE_REF"
          echo "ref=origin/$BASE_REF" >> "$GITHUB_OUTPUT"

      - name: List changed files
        env:
          BASE: ${{ steps.base.outputs.ref }}
        run: |
          source .nivuus-socle/scripts/lib/changed-files.sh
          changed_files "$BASE" HEAD > changed.txt
          echo "Changed files:"
          cat changed.txt

      - name: Enforce the 500-line limit
        run: .nivuus-socle/scripts/check-file-size.sh < changed.txt

      - name: Enforce English in code
        env:
          BASE: ${{ steps.base.outputs.ref }}
        run: .nivuus-socle/scripts/check-english.sh --added-only "$BASE" HEAD < changed.txt

      - name: Enforce conventional commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ steps.base.outputs.ref }}
        run: .nivuus-socle/scripts/check-commits.sh "$BASE" HEAD

      - name: Enforce the pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: .nivuus-socle/scripts/check-commits.sh --subject "$PR_TITLE"
