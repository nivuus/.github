name: CI Python

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to run against
        type: string
        default: "3.12"
      test-paths:
        description: Space-separated pytest targets
        type: string
        default: tests
      lint-paths:
        description: Root directory to scan with ruff
        type: string
        default: "."
      changed-only:
        description: Restrict ruff to files changed by the pull request
        type: boolean
        default: true

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies when a manifest exists
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ] && grep -qE '^\[(build-system|project)\]' pyproject.toml; then
            pip install .
          else
            echo "No installable Python manifest, skipping dependency install."
          fi
          pip install ruff pytest

      # WHY THERE IS NO `ruff format --check` HERE. This workflow used to run
      # one, and no repository in the suite had ever adopted the formatter:
      # rerunning it in September 2026 found 98 files to reformat in installer,
      # 175 in home-stock and 12 in marketplace - about 50 000 lines of churn
      # for code nobody had asked to restyle. The 2026-08-27 socle plan already
      # recorded the cost ("85 fichiers a reformater sur trois depots, rouges
      # des l'adoption") and left the choice open; the choice made on
      # 2026-09-09 is to not enforce formatting at all.
      #
      # The reason is the one already written down in installer/ruff.toml: the
      # selection this suite lints for is E4/E7/E9/F, "real defects, never
      # style". A formatter check is style by definition, and an unadopted one
      # measured nothing about the code - only whether `ruff format` had been
      # run. Worse, it was invisible where it mattered: with changed-only the
      # check reads the diff on a pull request but the WHOLE TREE on a push to
      # main, so four repositories carried a green pull request and a red main
      # for the same commit, continuously since 2026-08-27.
      #
      # Re-adding it is a deliberate act: reformat the trees in the same
      # commit, or the branch that adds it back goes red on merge, not before.
      - name: Run ruff
        env:
          LINT_PATHS: ${{ inputs.lint-paths }}
          CHANGED_ONLY: ${{ inputs.changed-only }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$CHANGED_ONLY" = "true" ] && [ -n "$BASE_REF" ]; then
            git fetch -q origin "$BASE_REF"
            mapfile -t files < <(
              git diff --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD" \
                | grep -E '\.pyi?$' || true
            )
            if [ "${#files[@]}" -eq 0 ]; then
              echo "No Python file changed, skipping."
              exit 0
            fi
            printf 'Checking %d changed file(s)\n' "${#files[@]}"
            ruff check "${files[@]}"
          else
            ruff check "$LINT_PATHS"
          fi

      - name: Run pytest
        env:
          TEST_PATHS: ${{ inputs.test-paths }}
        run: |
          found=0
          for path in $TEST_PATHS; do
            if [ -e "$path" ]; then
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No test path found, skipping."
            exit 0
          fi
          set +e
          # shellcheck disable=SC2086
          pytest $TEST_PATHS
          status=$?
          set -e
          # 5 means "no tests were collected", which is not a failure: the
          # paths exist but hold no pytest module. 1 means tests ran and
          # failed, and must still fail the job.
          if [ "$status" -eq 5 ]; then
            echo "No pytest tests collected in $TEST_PATHS, skipping."
            exit 0
          fi
          exit "$status"
