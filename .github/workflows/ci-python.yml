name: CI Python

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to run against
        type: string
        default: "3.12"
      test-paths:
        description: Space-separated pytest targets
        type: string
        default: tests
      lint-paths:
        description: Root directory to scan with ruff
        type: string
        default: "."

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      # A shallow checkout is enough: the only step that needed history was
      # the changed-only diff, and it is gone. Verified 2026-09-09 that no
      # suite in installer, marketplace or home-stock reads git history.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies when a manifest exists
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ] && grep -qE '^\[(build-system|project)\]' pyproject.toml; then
            pip install .
          else
            echo "No installable Python manifest, skipping dependency install."
          fi
          pip install ruff pytest

      # WHY THERE IS NO `ruff format --check` HERE. This workflow used to run
      # one, and no repository in the suite had ever adopted the formatter:
      # rerunning it in September 2026 found 98 files to reformat in installer,
      # 175 in home-stock and 12 in marketplace - about 50 000 lines of churn
      # for code nobody had asked to restyle. The 2026-08-27 socle plan already
      # recorded the cost ("85 fichiers a reformater sur trois depots, rouges
      # des l'adoption") and left the choice open; the choice made on
      # 2026-09-09 is to not enforce formatting at all.
      #
      # The reason is the one already written down in installer/ruff.toml: the
      # selection this suite lints for is E4/E7/E9/F, "real defects, never
      # style". A formatter check is style by definition, and an unadopted one
      # measured nothing about the code - only whether `ruff format` had been
      # run. Worse, it was invisible where it mattered: the workflow then had
      # a changed-only mode that read the diff on a pull request and the whole
      # tree on a push, so four repositories carried a green pull request and a
      # red main for the same commit, continuously from 2026-08-27. That mode
      # is gone too - see the next comment.
      #
      # Re-adding it is a deliberate act: reformat the trees in the same
      # commit, or the branch that adds it back goes red on merge, not before.
      # WHY THIS READS THE WHOLE TREE, ON A PULL REQUEST AS ON A PUSH.
      #
      # It used to have a `changed-only` input, defaulting to true, which
      # narrowed ruff to the files a pull request touched - but only when
      # github.event.pull_request.base.ref was set, which is to say only on a
      # pull request. A push to main fell through to the whole tree. The two
      # branches therefore asked DIFFERENT QUESTIONS of the same commit, and a
      # green pull request said nothing about the main it was about to become.
      #
      # Measured: installer, marketplace, home-stock and desk all carried a
      # green pull request and a red main, continuously from 2026-08-27 to
      # 2026-09-09. Nobody was ignoring a warning - the warning was on a page
      # nobody had a reason to open, because the merge button was green.
      #
      # The narrow mode is gone rather than merely defaulted off: an input
      # that reintroduces this on one line, in one repository, is how it comes
      # back. The three repositories calling this workflow lint their whole
      # tree in 9 to 16 seconds, so there was nothing to buy with it either.
      - name: Run ruff
        env:
          LINT_PATHS: ${{ inputs.lint-paths }}
        run: ruff check "$LINT_PATHS"

      - name: Run pytest
        env:
          TEST_PATHS: ${{ inputs.test-paths }}
        run: |
          found=0
          for path in $TEST_PATHS; do
            if [ -e "$path" ]; then
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No test path found, skipping."
            exit 0
          fi
          set +e
          # shellcheck disable=SC2086
          pytest $TEST_PATHS
          status=$?
          set -e
          # 5 means "no tests were collected", which is not a failure: the
          # paths exist but hold no pytest module. 1 means tests ran and
          # failed, and must still fail the job.
          if [ "$status" -eq 5 ]; then
            echo "No pytest tests collected in $TEST_PATHS, skipping."
            exit 0
          fi
          exit "$status"
